# CI: анализ, формат, тесты, сборка APK (с плейсхолдерами для Supabase).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: water_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: pub get
        run: flutter pub get
      - name: format
        run: dart format --set-exit-if-changed .
      - name: analyze
        run: flutter analyze
      - name: test
        run: flutter test
      - name: build apk (release, dart-define)
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
