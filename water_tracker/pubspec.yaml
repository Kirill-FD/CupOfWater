name: water_tracker
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  go_router: ^14.2.0
  home_widget: ^0.6.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.4
  intl: ^0.19.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.2
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4

dependency_overrides:
  # analyzer_plugin 0.12.x не собирается с analyzer 7.6 (build_runner).
  analyzer_plugin: ^0.13.4

flutter:
  uses-material-design: true
