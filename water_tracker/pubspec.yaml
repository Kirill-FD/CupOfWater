name: water_tracker
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  go_router: ^14.2.0
  home_widget: ^0.6.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.4
  intl: ^0.20.2
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.2
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  url_launcher: ^6.2.0
  webview_flutter: ^4.13.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4
  gotrue: ^2.20.0
  postgrest: ^2.7.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

dependency_overrides:
  # analyzer_plugin 0.12.x не собирается с analyzer 7.6 (build_runner).
  analyzer_plugin: ^0.13.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/animations/
    - assets/empty/
    - assets/icon/
    - assets/splash/

# Regenerate launcher mipmaps: dart run flutter_launcher_icons
# Исходные PNG: cd tools && npm install && npm run generate-assets  (Node.js + sharp)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#0288D1"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23

# Regenerate splash natives: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0288D1"
  image: "assets/splash/splash.png"
  android: true
  ios: true
  android_12:
    image: "assets/splash/splash_android12.png"
    icon_background_color: "#0288D1"
