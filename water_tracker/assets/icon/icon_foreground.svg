<svg width="1024" height="1024" viewBox="0 0 432 432" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="drop-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6F4FB" />
    </linearGradient>
    <linearGradient id="drop-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.0)" />
      <stop offset="100%" stop-color="rgba(2,136,209,0.35)" />
    </linearGradient>
    <clipPath id="drop-clip">
      <path d="M216 100 C 216 100, 130 198, 130 268 a 86 86 0 0 0 172 0 C 302 198, 216 100, 216 100 Z" />
    </clipPath>
  </defs>

  <!-- Масштаб от центра: adaptive-icon обрезает маской ~внешние 18dp; без отступов верх капли обрезается. -->
  <g transform="translate(216 216) scale(0.66) translate(-216 -216)">
    <path
      d="M216 100 C 216 100, 130 198, 130 268 a 86 86 0 0 0 172 0 C 302 198, 216 100, 216 100 Z"
      fill="url(#drop-fill)"
    />

    <g clip-path="url(#drop-clip)">
      <rect x="80" y="280" width="320" height="160" fill="url(#drop-water)" />
      <path d="M 80 286 Q 130 270 180 286 T 280 286 T 380 286 V 360 H 80 Z" fill="rgba(2,136,209,0.18)" />
      <path d="M 80 304 Q 130 290 180 304 T 280 304 T 380 304 V 360 H 80 Z" fill="rgba(2,136,209,0.10)" />
    </g>

    <ellipse cx="186" cy="180" rx="14" ry="28" fill="rgba(255,255,255,0.65)" transform="rotate(-15 186 180)" />
  </g>
</svg>
